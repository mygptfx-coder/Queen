<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Princess Hira 👑</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="no-scroll">

    <!-- Audio Files -->
    <!-- Aap apni pasand ka music URL yahan change kar sakte hain -->
    <audio id="bgMusic" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/romantic_music.ogg" type="audio/ogg">
    </audio>
    <audio id="fireworkSound">
        <source src="https://actions.google.com/sounds/v1/foley/fireworks_whistle.ogg" type="audio/ogg">
    </audio>

    <div id="hearts-container"></div>

    <div id="scroll-warning" class="scroll-warning">
        Candles bujhao Phonk mar k 🌬️🎂
    </div>

    <header class="hero-section">
        <div class="header-titles floating">
            <h3 class="date-tag">13 August</h3>
            <h1 class="main-tag">Meri Princess ka Birthday 👑</h1>
        </div>

        <div class="cake-container floating-slow">
            <div class="cake">
                <div class="plate"></div>
                <div class="layer layer-bottom"></div>
                <div class="layer layer-middle"></div>
                <div class="layer layer-top"><span class="hbd-text">HBD Hira</span></div>
                <div class="icing"></div>
                <div class="candles-group">
                    <div class="candle"><div class="flame" id="flame1"></div></div>
                    <div class="candle"><div class="flame" id="flame2"></div></div>
                    <div class="candle"><div class="flame" id="flame3"></div></div>
                </div>
            </div>
        </div>

        <div class="mic-status-box pulsing" id="micStatus">
            🎙️ Mic Permission Processing... Phonk Marain Candle Bujhane K Liye!
        </div>
    </header>

    <main id="mainContent" class="main-content">
        <!-- Content same as previous version... -->
    </main>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const fireworkSound = document.getElementById('fireworkSound');

        // Generating Animated Hearts
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 3 + 4 + 's';
                container.appendChild(heart);
            }
        }
        createHearts();

        async function initMicPermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('micStatus').innerText = "🎙️ Mic Active! Phonk Marain 🌬️";
                document.getElementById('micStatus').classList.remove('pulsing');
                
                // Mic permission milte hi music load kar dein
                bgMusic.volume = 0.5;
                
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                analyser.fftSize = 256;

                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function detectBlow() {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) sum += dataArray[i];
                    let average = sum / bufferLength;

                    if (average > 50 && !candleBlown) { 
                        extinguishCandles();
                    }
                    requestAnimationFrame(detectBlow);
                }
                detectBlow();
            } catch (err) {
                document.getElementById('micStatus').innerText = "⚠️ Please Allow Mic Access!";
            }
        }

        let candleBlown = false;
        function extinguishCandles() {
            candleBlown = true;
            document.querySelectorAll('.flame').forEach(f => f.style.display = 'none');
            
            // Celebration Start
            bgMusic.play();
            fireworkSound.play();
            
            triggerConfetti();
            document.body.classList.remove('no-scroll');
            document.getElementById('micStatus').innerText = "🎉 Happy Birthday My Princess! 🎉";
            
            setTimeout(() => {
                document.getElementById('mainContent').style.opacity = '1';
                document.getElementById('wishSection').scrollIntoView({ behavior: 'smooth' });
            }, 800);
        }

        function triggerConfetti() {
            // ... (confetti logic remains same as before)
        }

        window.addEventListener('DOMContentLoaded', initMicPermission);
    </script>
</body>
</html>
